<style>:root {
  --acento: #F2383F; --acento-osc: #D92B32; --acento-suave: rgba(242, 56, 63, .12);
  --rojo: #FF6B6B; --rojo-suave: rgba(255, 107, 107, .12);
  --ambar: #FFB347; --ambar-suave: rgba(255, 179, 71, .13);
  --verde: #4CC38A; --azul: #6BAAFF;
  --serie-1: #F2383F; --serie-2: #D3D6DB;
  --r: 6px; --r-peq: 4px;
  --fuente: 'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
  --mono: 'IBM Plex Mono', 'Cascadia Mono', 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace;
  --bg: #0E0F12; --sup: #121317; --sup2: #17191E; --sup3: #22252B; --borde: #23262C; --borde2: #2F333A;
  --tinta: #E6E7E9; --tinta2: #8F949C; --tinta3: #5E636C; --acento-tinta: #FF6A70;
  --lateral: #121317; --lateral-activo: #1B1D23; --cabecera: #101115;
  --marca-tinta: #FFFFFF; --marca-rojo: #F2383F;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #F4F4F5; --sup: #FFF; --sup2: #F1F1F3; --sup3: #E6E7EA; --borde: #E0E1E5; --borde2: #C9CBD1;
  --tinta: #141414; --tinta2: #5A5D63; --tinta3: #9A9DA3; --acento-suave: rgba(225, 37, 44, .08); --acento-tinta: #C4252B;
  --acento: #E1252C; --acento-osc: #C01F25;
  --rojo: #C9302C; --rojo-suave: rgba(201, 48, 44, .09); --ambar: #A85A00; --ambar-suave: rgba(200, 120, 0, .10); --verde: #1E8C5A;
  --serie-1: #E1252C; --serie-2: #3F434A;
  --lateral: #FFFFFF; --lateral-activo: #F1F1F3; --cabecera: #FFFFFF;
  --marca-tinta: #141414; --marca-rojo: #E1252C;
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--tinta); font-family: var(--fuente); font-size: 14px; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; }
input, select { background: var(--sup2); border: 1px solid var(--borde); border-radius: var(--r-peq); padding: 8px 10px; outline: none; }
input:focus, select:focus { border-color: var(--acento-tinta); }
::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-thumb { background: var(--borde); border-radius: 4px; }
h1 { font-size: 24px; font-weight: 600; letter-spacing: -.01em; }

.tenue { color: var(--tinta2); }
.fuerte { font-weight: 700; }
.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: .95em; }
.mono { font-family: var(--mono); }

/* ── marca ── */
.marca { display: inline-flex; color: var(--marca-tinta); line-height: 0; }
.marca .pf-rojo { fill: var(--marca-rojo); }
.acceso .marca { align-self: center; margin-bottom: 10px; }

/* ── estructura: menú lateral + zona principal ── */
.app { display: flex; min-height: 100vh; }
.lateral { flex: 0 0 236px; width: 236px; background: var(--lateral); border-right: 1px solid var(--borde); display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh; overflow-y: auto; z-index: 40; }
.lateral-marca { padding: 18px 16px 8px; display: flex; flex-direction: column; gap: 4px; text-align: left; }
.lateral-marca .version { font: 500 11px var(--mono); color: var(--tinta3); letter-spacing: .06em; }
.nav { display: flex; flex-direction: column; padding-bottom: 8px; }
.nav-grupo { font: 600 10.5px/1 var(--fuente); letter-spacing: .12em; text-transform: uppercase; color: var(--tinta3); padding: 18px 14px 6px; }
.nav-btn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 14px; border-left: 2px solid transparent;
  color: var(--tinta2); font: 500 13.5px/1.2 var(--fuente); text-align: left; }
.nav-btn:hover { background: var(--sup2); color: var(--tinta); }
.nav-btn.activo { background: var(--lateral-activo); color: var(--tinta); border-left-color: var(--acento); }
.nav-tecla { margin-left: auto; font: 500 11px var(--mono); color: var(--tinta3); }
.nav-badge { margin-left: auto; background: #C42A2F; color: #fff; border-radius: 3px; padding: 1px 6px; font: 600 11px var(--mono); }
.lateral-pie { margin-top: auto; border-top: 1px solid var(--borde); padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 4px;
  font: 400 11.5px var(--mono); color: var(--tinta3); }
.lateral-pie .fila-ico { display: flex; gap: 6px; margin-top: 6px; }
.principal { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; }
.cabecera { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 8px 24px;
  background: var(--cabecera); border-bottom: 1px solid var(--borde); flex-wrap: wrap; }
.miga { font-size: 12.5px; color: var(--tinta2); }
.miga b { color: var(--tinta); font-weight: 500; }
.miga span { color: var(--tinta3); margin: 0 6px; }
.herramientas { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.btn-ico { width: 34px; height: 34px; border-radius: var(--r-peq); border: 1px solid var(--borde2); color: var(--tinta2); font-size: 15px; display: inline-grid; place-items: center; }
.btn-ico:hover:not(:disabled) { color: var(--tinta); border-color: var(--tinta3); }
.btn-ico:disabled { opacity: .35; cursor: default; }
.guardado { font-size: 12px; color: var(--tinta2); white-space: nowrap; font-family: var(--mono); }
.guardado::before { content: '●'; margin-right: 6px; color: var(--verde); }
.guardado.pendiente::before, .guardado.guardando::before { color: var(--ambar); }
.guardado.error::before, .guardado.conflicto::before { color: var(--rojo); }
.guardado.soloLectura::before { color: var(--azul); }
.banda-error, .banda-info { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 20px; background: var(--rojo-suave); color: var(--rojo); font-weight: 600; font-size: 13px; }
.banda-info { background: var(--acento-suave); color: var(--acento-tinta); }

/* ── páginas ── */
main { width: 100%; max-width: 1560px; margin: 0 auto; padding: 22px 24px 60px; box-sizing: border-box; }
.pagina { display: flex; flex-direction: column; gap: 16px; }
.pag-cab { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.sub { color: var(--tinta2); font-size: 13px; margin-top: 2px; }
.filtros { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.buscar { min-width: 200px; }
.pildora { display: inline-flex; background: var(--sup); border: 1px solid var(--borde); border-radius: 9px; padding: 3px; gap: 2px; }
.pildora button { padding: 6px 12px; border-radius: 6px; color: var(--tinta2); font-weight: 600; font-size: 13px; }
.pildora button.activo { background: var(--sup3); color: var(--tinta); }
.pildora.peq button { padding: 4px 10px; font-size: 12px; }

/* ── botones ── */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: var(--r-peq); border: 1px solid var(--borde2); background: var(--sup2); font-weight: 600; font-size: 13px; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--tinta2); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primario { background: var(--acento); border-color: var(--acento); color: #140405; }
:root[data-theme="light"] .btn.primario { color: #fff; }
.btn.primario:hover { background: var(--acento-osc); }
.btn.peligro { color: var(--rojo); border-color: var(--rojo); background: transparent; }
.btn.ambar { color: var(--ambar); border-color: var(--ambar); background: var(--ambar-suave); }
.btn.peq { padding: 5px 10px; font-size: 12px; }
.btn.grande { width: 100%; justify-content: center; padding: 12px; font-size: 15px; }
.btn.mini { padding: 1px 7px; font-size: 12px; border-radius: 6px; border: 1px solid var(--borde); }
.btn.mini:hover { border-color: var(--acento-tinta); color: var(--acento-tinta); }
.enlace { color: var(--acento-tinta); font-weight: 600; font-size: 13px; text-align: left; }
.enlace:hover { text-decoration: underline; }

/* ── KPIs ── */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.kpi { background: var(--sup); border: 1px solid var(--borde); border-radius: var(--r); padding: 14px 16px; }
.kpi.clic { cursor: pointer; }
.kpi-t { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--tinta2); font-weight: 700; }
.kpi-v { font-size: 24px; font-weight: 600; margin-top: 6px; font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.kpi-s { font-size: 12px; color: var(--tinta2); margin-top: 4px; display: flex; align-items: center; gap: 8px; }
.kpi.acento { box-shadow: inset 0 2px 0 var(--acento); } .kpi.acento .kpi-v { color: var(--tinta); }
.kpi.rojo { border-color: var(--rojo); } .kpi.rojo .kpi-v { color: var(--rojo); }
.kpi.ambar { border-color: var(--ambar); } .kpi.ambar .kpi-v { color: var(--ambar); }
.barra { height: 4px; background: var(--sup3); border-radius: 2px; overflow: hidden; min-width: 60px; flex: 1; }
.barra > div { height: 100%; background: var(--acento-tinta); }

/* ── avisos ── */
.avisos { display: flex; flex-direction: column; gap: 6px; }
.aviso { display: grid; grid-template-columns: 12px 190px minmax(140px, 1fr) minmax(150px, 1.2fr) 110px auto; align-items: center; gap: 12px; padding: 9px 14px; background: var(--sup); border: 1px solid var(--borde); border-radius: var(--r-peq); }
.aviso-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ambar); }
.aviso.vencida { border-color: var(--rojo); background: var(--rojo-suave); }
.aviso.vencida .aviso-dot { background: var(--rojo); }
.aviso-cuando { font-weight: 700; font-size: 13px; }
.aviso.vencida .aviso-cuando { color: var(--rojo); }
.aviso-quien { color: var(--tinta2); font-size: 12px; }
.aviso-imp { text-align: right; font-weight: 600; font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ── tablas ── */
.tabla-marco { overflow: auto; border: 1px solid var(--borde); border-radius: var(--r); background: var(--sup); }
.tabla-marco.alto { max-height: 70vh; }
.tabla { width: 100%; border-collapse: collapse; font-size: 13px; }
.tabla th { position: sticky; top: 0; z-index: 2; background: var(--sup); text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: .4px; color: var(--tinta2); font-weight: 700; padding: 9px 8px; border-bottom: 1px solid var(--borde); white-space: nowrap; cursor: default; user-select: none; }
.tabla.deudas th { cursor: pointer; }
.tabla td { padding: 7px 8px; border-bottom: 1px solid var(--borde); white-space: nowrap; }
.tabla tbody tr:last-child td { border-bottom: none; }
.tabla tfoot td { background: var(--sup2); font-weight: 700; border-top: 1px solid var(--borde2); position: sticky; bottom: 0; }
.tabla.deudas tbody tr { cursor: pointer; }
.tabla.deudas tbody tr:hover td { background: var(--sup2); }
.tabla.deudas tr.terminada td { color: var(--tinta2); }
.celda-nombre { display: flex; flex-direction: column; gap: 4px; min-width: 120px; }
.tabla.deudas { font-size: 12.5px; }
.celda-nombre .barra { max-width: 140px; }
.vacio-caja { padding: 28px; text-align: center; color: var(--tinta2); background: var(--sup); border: 1px dashed var(--borde2); border-radius: var(--r); line-height: 1.6; }
td.vacio-caja { border: none; }

.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; background: var(--sup3); color: var(--tinta2); white-space: nowrap; }
.badge.verde { background: rgba(93, 219, 160, .14); color: var(--verde); }
.badge.rojo { background: var(--rojo-suave); color: var(--rojo); }
.badge.ambar { background: var(--ambar-suave); color: var(--ambar); }

/* ── cuadro editable ── */
.cuadro { display: flex; flex-direction: column; gap: 10px; }
.cuadro > .btn { align-self: flex-start; }
.barra-acciones { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.ba-izq { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.ba-der { display: flex; gap: 6px; flex-wrap: wrap; }
.cuadro-t td { padding: 0; height: 32px; }
.cuadro-t td.n, .cuadro-t td.num.tenue, .cuadro-t td.fuerte, .cuadro-t td.acc { padding: 0 10px; }
.cuadro-t td.n { color: var(--tinta2); font-variant-numeric: tabular-nums; }
.cuadro-t tr.pagada td { color: var(--tinta2); }
.cuadro-t tr.pagada td.fuerte { color: var(--tinta2); font-weight: 600; }
.cuadro-t tr.vencida td.n, .cuadro-t tr.impagada td.n { box-shadow: inset 3px 0 0 var(--rojo); color: var(--rojo); font-weight: 700; }
.cuadro-t tr.proxima td { background: var(--acento-suave); }
.cuadro-t tr.proxima td.n { box-shadow: inset 3px 0 0 var(--acento-tinta); color: var(--acento-tinta); font-weight: 700; }
.ed { position: relative; cursor: text; outline: none; }
.ed .ed-ver { display: block; padding: 7px 10px; min-height: 30px; }
td.ed:focus, div.ed:focus, span.ed:focus { box-shadow: inset 0 0 0 2px var(--acento-tinta); border-radius: 2px; }
.ed:hover:not(.bloq) { background: var(--sup2); }
.ed.bloq { cursor: default; }
.ed.manual::after { content: ''; position: absolute; top: 4px; right: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--ambar); }
.ed.editando { background: var(--sup2); }
.ed-wrap { display: flex; align-items: center; position: relative; }
.ed-wrap input { width: 100%; min-width: 80px; border-radius: 0; border: none; box-shadow: inset 0 0 0 2px var(--acento-tinta); padding: 6px 9px; background: var(--sup); text-align: inherit; }
.ed-wrap input.mal { box-shadow: inset 0 0 0 2px var(--rojo); }
.ed-restaurar { position: absolute; right: 4px; font-size: 13px; color: var(--ambar); padding: 0 4px; }
.ed-error { position: absolute; top: 100%; left: 0; z-index: 5; background: var(--rojo); color: #fff; font-size: 11px; padding: 3px 8px; border-radius: 4px; white-space: nowrap; }
.ed .vacio { color: var(--tinta3); }
.cuadro-t td.obs .ed-ver { min-width: 160px; max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
.cuadro-t td.dig .ed-ver { min-width: 50px; }
.sel-celda select, .estado-celda select { width: 100%; border: none; border-radius: 0; background: transparent; padding: 6px 8px; font-size: 12px; cursor: pointer; appearance: none; -webkit-appearance: none; }
.sel-celda select:hover, .estado-celda select:hover { background: var(--sup2); }
.sel-celda option, .estado-celda option { background: var(--sup); color: var(--tinta); }
.sel-celda select:focus, .estado-celda select:focus { box-shadow: inset 0 0 0 2px var(--acento-tinta); }
.sel-estado { font-weight: 600; }
.sel-estado.vencida, .sel-estado.impagada { color: var(--rojo); }
.sel-estado.pagada { color: var(--verde); }
.sugerencia { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; border-radius: var(--r-peq); background: var(--acento-suave); border: 1px solid var(--acento-tinta); font-size: 13px; }
.ayuda { font-size: 12px; color: var(--tinta2); line-height: 1.5; }

/* ── ficha ── */
.ficha-nav { display: flex; align-items: center; gap: 12px; }
.ficha-cab { background: var(--sup); border: 1px solid var(--borde); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.ficha-titulo { display: flex; align-items: center; gap: 12px; }
.titulo-ed .ed-ver { font-size: 22px; font-weight: 800; padding: 2px 6px; margin-left: -6px; border-radius: 6px; }
.titulo-ed .ed-wrap input { font-size: 20px; font-weight: 700; }
.ficha-campos, .cond-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px 14px; }
.ficha-campos label, .cond-grid label, .form label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--tinta2); font-weight: 700; }
.ficha-campos label .ed, .cond-grid label .ed, .ficha-campos select, .cond-grid select { text-transform: none; letter-spacing: 0; font-size: 14px; font-weight: 500; color: var(--tinta); }
.campo-ed { border: 1px solid var(--borde); border-radius: var(--r-peq); background: var(--sup2); }
.campo-ed .ed-ver { padding: 7px 10px; }
.campo-ed.calc { padding: 7px 10px; background: transparent; border-style: dashed; color: var(--tinta2); font-size: 14px; text-transform: none; }
.ancho { grid-column: 1 / -1; }
.cond-grid.compacto { grid-template-columns: repeat(auto-fill, minmax(220px, 280px)); }
.bonif { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px 14px; padding: 12px; border: 1px dashed var(--acento-tinta); border-radius: var(--r-peq); }
.bonif > strong, .bonif > .ayuda { grid-column: 1 / -1; }
.seccion-plegable { background: var(--sup); border: 1px solid var(--borde); border-radius: var(--r); padding: 4px 14px; }
.seccion-plegable > .cond-grid { padding: 6px 0 14px; }
.plegar { width: 100%; text-align: left; padding: 10px 0; font-weight: 700; font-size: 13px; color: var(--tinta); }
.historial { display: flex; flex-direction: column; padding-bottom: 10px; }
.hist-fila { display: grid; grid-template-columns: 130px 1fr minmax(120px, 280px); gap: 12px; align-items: center; padding: 4px 0; border-top: 1px solid var(--borde); font-size: 13px; }
.hist-fecha { color: var(--tinta2); font-variant-numeric: tabular-nums; font-size: 12px; }
.hist-nota .ed-ver { padding: 3px 8px; color: var(--tinta2); font-style: italic; }
.zona-peligro { display: flex; justify-content: flex-end; }

/* ── modal ── */
.modal-fondo { position: fixed; inset: 0; z-index: 100; background: rgba(0, 0, 0, .55); display: flex; align-items: flex-start; justify-content: center; padding: 60px 16px; overflow-y: auto; }
.modal { width: 100%; max-width: 460px; background: var(--sup); border: 1px solid var(--borde2); border-radius: 14px; box-shadow: 0 20px 60px rgba(0, 0, 0, .4); }
.modal.ancho { max-width: 760px; }
.modal-cab { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px 0; }
.modal-cab .x { color: var(--tinta2); font-size: 16px; }
.modal-cuerpo { padding: 16px 20px; }

/* desplegable visible para enlazar un plan aplaza con su préstamo */

/* ── gráficas ── */
.panel-grafica { background: var(--sup); border: 1px solid var(--borde); border-radius: var(--r); padding: 14px 14px 6px; }
.pg-cab { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }

.tooltip { position: absolute; z-index: 5; min-width: 190px; pointer-events: none; background: var(--sup2); border: 1px solid var(--borde2); border-radius: 8px; padding: 8px 10px; box-shadow: 0 8px 24px rgba(0,0,0,.25); font-size: 12px; }

/* ── calculadora ── */
.calc { display: flex; flex-direction: column; gap: 14px; }
.calc-form { background: var(--sup); border: 1px solid var(--borde); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; }

.calc-datos span { display: flex; flex-direction: column; gap: 2px; }
.calc-datos strong { font-size: 15px; color: var(--tinta); font-family: var(--mono); font-variant-numeric: tabular-nums; }
.calc-datos.linea { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); background: var(--sup); border: 1px solid var(--borde); border-radius: var(--r); padding: 14px 16px; }
.ok { color: var(--verde) !important; }

.info-caja { padding: 10px 12px; border-radius: var(--r-peq); background: var(--acento-suave); color: var(--acento-tinta); border: 1px solid var(--acento-tinta); font-size: 13px; font-weight: 600; }

/* campos de fecha con calendario */

.form .check { flex-direction: row; align-items: center; gap: 8px; text-transform: none; letter-spacing: 0; font-size: 13px; color: var(--tinta); font-weight: 500; grid-column: 1 / -1; }

.linea { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 12px; padding: 8px 6px; border-radius: var(--r-peq); text-align: left; width: 100%; }

.fuerza { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 600; color: var(--tinta2); }

.ok-caja { padding: 10px 12px; border-radius: var(--r-peq); background: var(--acento-suave); color: var(--acento-tinta); font-size: 13px; font-weight: 700; }

/* ── v8.7: buscador ── */
kbd { display: inline-block; min-width: 18px; padding: 1px 5px; border: 1px solid var(--borde2); border-bottom-width: 2px; border-radius: 5px; font: 600 11px/1.5 var(--fuente); color: var(--tinta2); background: var(--sup2); text-align: center; }
.btn-buscar { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 8px 0 10px; border: 1px solid var(--borde); border-radius: 8px; color: var(--tinta2); font-size: 13px; font-weight: 600; margin-right: 4px; }
.btn-buscar:hover { color: var(--tinta); border-color: var(--borde2); }
.btn-buscar .lupa, .buscador-cab .lupa { font-size: 18px; line-height: 1; }
.buscador-fondo { position: fixed; inset: 0; z-index: 120; background: rgba(0, 0, 0, .5); display: flex; justify-content: center; align-items: flex-start; padding: 9vh 16px 16px; }
.buscador { width: 100%; max-width: 640px; max-height: 78vh; display: flex; flex-direction: column; background: var(--sup); border: 1px solid var(--borde2); border-radius: 14px; box-shadow: 0 24px 70px rgba(0, 0, 0, .45); overflow: hidden; }
.buscador-cab { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--borde); color: var(--tinta2); }
.buscador-cab input { flex: 1; min-width: 0; border: none; background: transparent; font-size: 16px; padding: 4px 0; color: var(--tinta); }
.buscador-cab input:focus { border: none; }
.kbd-btn { display: inline-flex; }
.buscador-lista { overflow-y: auto; padding: 6px 6px 10px; }
.res-grupo { display: flex; flex-direction: column; }
.res-titulo { padding: 10px 10px 4px; font-size: 11px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; color: var(--tinta3); }
.res { display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px 10px; border-radius: 8px; text-align: left; }
.res.sel { background: var(--sup3); }
.res.sel .res-t { color: var(--acento-tinta); }
.res-texto { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.res-t { font-weight: 700; font-size: 14px; color: var(--tinta); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res-s { font-size: 12px; color: var(--tinta2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res-d { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--tinta); }
.res mark { background: transparent; color: var(--acento-tinta); text-decoration: underline; text-underline-offset: 3px; }
.res-mas, .res-pista { padding: 6px 10px; font-size: 12px; color: var(--tinta3); }
.res-pista { padding: 14px 10px 6px; line-height: 1.5; }
.res-vacio { padding: 22px 14px; font-size: 13px; color: var(--tinta2); line-height: 1.6; text-align: center; }
.buscador-pie { display: flex; gap: 16px; padding: 8px 14px; border-top: 1px solid var(--borde); font-size: 12px; color: var(--tinta3); }
.buscador-pie kbd { margin-right: 3px; }
.cuadro-t tr.resaltada td { background: var(--ambar-suave); animation: parpadeo 1.2s ease-in-out 2; }
.cuadro-t tr.resaltada td.n { box-shadow: inset 3px 0 0 var(--ambar); color: var(--ambar); font-weight: 800; }
@keyframes parpadeo { 50% { background: transparent; } }
@media (max-width: 860px) {
  .btn-buscar .txt, .btn-buscar kbd, .buscador-pie { display: none; }
  .btn-buscar { padding: 0; width: 34px; justify-content: center; margin-right: 0; }
  .buscador-fondo { padding: 10px; }
  .buscador { max-height: 86vh; }
  .clave-recuperacion { grid-template-columns: repeat(2, 1fr); }
  .acciones-papelera { flex-direction: column; align-items: stretch; }
  .banda-aviso { padding: 9px 14px; }
}

/* ── v8.8: clientes ── */
.bloque-cab { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 4px; }
.bloque-cab h2 { margin-right: auto; }
.bloque-cab h2 .tenue { font-weight: 600; font-size: 14px; margin-left: 4px; }
.bloque-cab .buscar { width: 240px; }
.clientes-bloque { display: flex; flex-direction: column; gap: 12px; }
.cuenta.aviso-r { border-color: var(--rojo); }
.txt-rojo { color: var(--rojo); font-weight: 700; }
.aviso-acc { justify-content: flex-end; flex-wrap: nowrap; gap: 6px; }

/* ── v8.8: WhatsApp ── */
.btn.wa { color: #25a35a; border-color: rgba(37, 163, 90, .55); }
:root:not([data-theme="light"]) .btn.wa { color: #4cd187; }
.btn.wa:hover:not(:disabled) { border-color: #25a35a; }
.btn.wa.apagado { opacity: .55; }
.wa-reciente { margin-left: 6px; font-size: 10.5px; font-weight: 700; color: var(--ambar); }
.texto-wa { width: 100%; min-height: 150px; resize: vertical; font: 14px/1.5 var(--fuente); background: var(--sup2); color: var(--tinta); border: 1px solid var(--borde); border-radius: var(--r-peq); padding: 10px 12px; text-transform: none; letter-spacing: 0; }
.textos-wa { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
.textos-wa label { display: flex; flex-direction: column; gap: 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--tinta2); font-weight: 700; }
.textos-wa label .enlace { text-transform: none; letter-spacing: 0; font-size: 12px; align-self: flex-start; }
.textos-wa textarea { width: 100%; resize: vertical; font: 13px/1.5 var(--fuente); background: var(--sup2); color: var(--tinta); border: 1px solid var(--borde); border-radius: var(--r-peq); padding: 8px 10px; text-transform: none; letter-spacing: 0; font-weight: 500; }
.textos-wa textarea:focus, .texto-wa:focus { outline: none; border-color: var(--acento-tinta); }
.var-wa { display: inline-block; margin: 0 14px 4px 0; }
.var-wa code { font: 600 12px ui-monospace, Consolas, monospace; color: var(--acento-tinta); }

/* ── v8.8: documentos ── */
.documentos { position: relative; background: var(--sup); border: 1px solid var(--borde); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.documentos.encima { border-color: var(--acento-tinta); border-style: dashed; }
.doc-cab { display: flex; align-items: center; gap: 10px; }
.doc-cab h3 { margin: 0 auto 0 0; }
.doc-vacio { font-size: 13px; color: var(--tinta2); padding: 14px; border: 1px dashed var(--borde2); border-radius: var(--r-peq); text-align: center; line-height: 1.5; }
.doc-lista { display: flex; flex-direction: column; }
.doc-fila { display: flex; align-items: center; gap: 12px; padding: 8px 2px; border-top: 1px solid var(--borde); }
.doc-fila:first-child { border-top: none; }
.doc-ico { font-size: 22px; flex: none; }
.doc-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.doc-nombre { font-weight: 700; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doc-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--tinta2); }
.doc-meta select { padding: 2px 6px; font-size: 12px; border-radius: 6px; }
.doc-nota { min-width: 80px; }
.doc-acc { display: flex; gap: 6px; flex: none; }
.doc-soltar { position: absolute; inset: 0; display: grid; place-items: center; background: var(--acento-suave); border-radius: var(--r); font-weight: 800; color: var(--acento-tinta); pointer-events: none; }
.visor { display: flex; justify-content: center; background: var(--sup2); border-radius: var(--r-peq); min-height: 200px; }
.visor img { max-width: 100%; max-height: 70vh; object-fit: contain; }
.visor iframe { width: 100%; height: 70vh; border: none; background: #fff; border-radius: var(--r-peq); }
.visor pre { padding: 14px; white-space: pre-wrap; font-size: 13px; max-height: 70vh; overflow: auto; width: 100%; }
.revision { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
@media (max-width: 860px) {
  .bloque-cab .buscar { width: 100%; order: 3; }
  .doc-fila { flex-wrap: wrap; }
  .doc-acc { margin-left: 34px; }
  .aviso-acc { grid-column: 1 / -1; justify-content: flex-start; }
}

/* ── v8.9: documentos en PDF ── */
.papel-marco { background: #8f8a82; border-radius: var(--r); padding: 22px 16px; max-height: 70vh; overflow: auto; margin-top: 12px; }
.pagina > .papel-marco { max-height: none; }
.papel-marco .doc-papel { box-shadow: 0 4px 24px rgba(0, 0, 0, .25); border-radius: 2px; }
.doc-opciones .fila { align-items: end; }
.doc-opciones .casilla { align-self: center; }
.aviso-legal { padding: 9px 12px; border-radius: var(--r-peq); background: var(--sup2); border-left: 3px solid var(--ambar); color: var(--tinta2); font-size: 12px; line-height: 1.5; }
.faltan-doc .enlace { font-size: 13px; }
.modal-pie .pie-izq { margin-right: auto; align-self: center; max-width: 52%; }
.informe-filtros { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.mes-sel { display: flex; align-items: center; gap: 6px; }
.mes-sel input { width: 170px; }
.sub-h3 { margin-top: 8px; }
@media (max-width: 860px) {
  .papel-marco { padding: 10px 6px; }
  .papel-marco .doc-papel { padding: 18px 16px; font-size: 11.5px; }
  .modal-pie .pie-izq { max-width: 100%; }
  .papel-marco .doc-kpis { grid-template-columns: 1fr 1fr; }
  .papel-marco .doc-kpis > div { border-bottom: 1px solid #d8d3cb; }
  .papel-marco .doc-dos, .papel-marco .doc-firmas { gap: 16px; }
  .papel-marco .doc-firmas { row-gap: 0; }
}

/* ── v8.9.2: seguimiento de la tarjeta ── */
.seguimiento-tarjeta { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
.tendencia { font-weight: 700; font-size: 13px; padding: 4px 10px; border-radius: 14px; background: var(--sup2); color: var(--tinta2); }
.tendencia.baja { color: var(--verde); background: var(--acento-suave); }
.tendencia.sube { color: var(--rojo); background: var(--rojo-suave); }
details.seccion-plegable > summary { cursor: pointer; list-style: none; padding: 10px 0; font-weight: 700; }
details.seccion-plegable > summary::before { content: '▸ '; }
details.seccion-plegable[open] > summary::before { content: '▾ '; }

/* ── v8.9.2: domicilio con callejero y cuentas ── */
.direccion .fila.dir-fila { grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); }
.direccion .dir-fila.compacta { grid-template-columns: repeat(auto-fit, minmax(68px, 1fr)); }
.direccion label.doble { grid-column: span 2; }
.direccion label.triple { grid-column: span 3; }
.buscar-dir { font-size: 11px; }
.buscar-dir .sugeridor input { border-color: var(--acento-tinta); }
.sugeridor { position: relative; }
.sugeridor input { width: 100%; }
.sug-estado { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--tinta3); text-transform: none; letter-spacing: 0; font-weight: 600; }
.sug-lista { position: absolute; z-index: 30; left: 0; right: 0; top: calc(100% + 4px); background: var(--sup); border: 1px solid var(--borde2); border-radius: var(--r-peq); box-shadow: 0 12px 30px rgba(0, 0, 0, .35); max-height: 300px; overflow-y: auto; padding: 4px; }
.sug { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; width: 100%; padding: 7px 9px; border-radius: 6px; text-align: left; text-transform: none; letter-spacing: 0; }
.sug.sel { background: var(--sup3); }
.sug-t { font-size: 13.5px; font-weight: 700; color: var(--tinta); }
.sug-s { font-size: 12px; color: var(--tinta2); font-weight: 500; }
.sug-vacio { padding: 9px; font-size: 12.5px; color: var(--tinta2); text-transform: none; letter-spacing: 0; font-weight: 500; }
.dir-previa { padding: 8px 12px; border-radius: var(--r-peq); background: var(--sup2); font-size: 13px; font-weight: 600; }
.dir-aviso { text-transform: none; letter-spacing: 0; }
.dato-linea { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 6px 0; }
.dato-linea .tenue { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; font-weight: 700; min-width: 80px; }
.cobros { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
.fila-alta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.fila-alta input { flex: 1; min-width: 180px; }
.mono { font-family: ui-monospace, 'SFMono-Regular', Consolas, monospace; font-size: 12.5px; }
.etiqueta-sola { display: flex; flex-direction: column; gap: 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--tinta2); font-weight: 700; margin-top: 6px; }
@media (max-width: 860px) {
  .direccion label.doble, .direccion label.triple { grid-column: 1 / -1; }
}

/* ── Personas (v8.9.3) ── */
.personas-t td { vertical-align: middle; }
.avatar.mini { display: inline-grid; width: 26px; height: 26px; font-size: 12px; vertical-align: middle; margin-right: 6px; }
.roles { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.rol { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11.5px; font-weight: 700; background: var(--sup3); color: var(--tinta2); white-space: nowrap; }
.rol.me-debe { background: var(--acento-suave); color: var(--acento-tinta); }
.rol.cliente { background: rgba(107, 170, 255, .14); color: var(--azul); }
:root[data-theme="light"] .rol.cliente { color: #2a5fb0; }
.rol.le-debo { background: var(--ambar-suave); color: var(--ambar); }
.relaciones { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 16px 0; }
.rel-caja { background: var(--sup); border: 1px solid var(--borde); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.rel-caja p { font-size: 13px; }
.rel-lista { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.fila-enlazar { display: flex; gap: 6px; width: 100%; }
.fila-enlazar select { flex: 1; min-width: 0; }
.chip-persona { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 12px; border: 1px solid var(--borde2); font-size: 12px; font-weight: 600; color: var(--acento-tinta); }
.chip-persona:hover { border-color: var(--acento-tinta); }
.cargar-personas { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; margin-bottom: 12px; background: var(--acento-suave); border: 1px dashed var(--acento-tinta); border-radius: var(--r-peq); }
.buscar-persona input { border-color: var(--borde2); }
.sug-estado.ok { color: var(--acento-tinta); }

/* ── Cómo te paga: selector de varias opciones ── */
.fila-cobros { margin-top: 10px; }
.selector-cobros { position: relative; display: inline-flex; flex-direction: column; gap: 4px; min-width: 240px; }
.sc-etq { font-size: 11px; text-transform: uppercase; letter-spacing: .4px; font-weight: 700; color: var(--tinta2); }
.sc-boton { display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; background: var(--sup2); border: 1px solid var(--borde); border-radius: var(--r-peq); padding: 8px 10px; font-size: 13px; font-weight: 600; text-transform: none; letter-spacing: 0; color: var(--tinta); }
.sc-boton:hover, .sc-boton[aria-expanded="true"] { border-color: var(--acento-tinta); }
.sc-boton span { color: var(--tinta2); }
.sc-lista { position: absolute; z-index: 40; top: calc(100% + 4px); left: 0; min-width: 100%; width: max-content; max-width: min(420px, 90vw); background: var(--sup); border: 1px solid var(--borde2); border-radius: var(--r-peq); box-shadow: 0 12px 30px rgba(0, 0, 0, .35); padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; text-transform: none; letter-spacing: 0; font-weight: 500; }
.sc-lista .casilla { font-size: 13px; color: var(--tinta); white-space: normal; }
.sc-sep { height: 1px; background: var(--borde); margin: 2px 0; }

/* ── Calculadora: enviar simulación ── */
.botones-calc { display: flex; gap: 8px; flex-wrap: wrap; }

@media (max-width: 860px) {
  .relaciones { grid-template-columns: 1fr; }
  .selector-cobros { min-width: 0; width: 100%; }
  .personas-t td:nth-child(3), .personas-t th:nth-child(3) { display: none; }
}
.fila-enlazar select { font-size: 13px; padding: 6px 8px; }

/* ── v8.9.4: personas repetidas ── */
.aviso-dup { display: flex; flex-direction: column; gap: 8px; }
.aviso-dup .botones { display: flex; gap: 6px; flex-wrap: wrap; }
.aviso-dup .btn { white-space: normal; text-align: left; }
.repetidas { margin: 12px 0 16px; padding: 12px 16px; background: var(--ambar-suave); border: 1px solid var(--ambar); border-radius: var(--r); display: flex; flex-direction: column; gap: 8px; }
.repetidas h3 { color: var(--ambar); margin: 0; }
.rep-fila { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 6px 0; border-top: 1px solid var(--borde); font-size: 13px; }
.rep-fila .enlace { font-size: 13px; }
.rep-fila .botones { display: flex; gap: 6px; flex-wrap: wrap; }

/* ── v8.10: coste de las deudas ── */
.etq-linea { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--tinta2); }
.etq-linea select, .etq-linea input { padding: 6px 8px; }
.coste-aviso { display: flex; gap: 14px; align-items: flex-start; background: var(--sup); border: 1px solid var(--borde); border-radius: var(--r); padding: 14px 16px; }
.coste-aviso strong { font-size: 15px; }
.coste-aviso p { margin-top: 3px; font-size: 13px; color: var(--tinta2); line-height: 1.5; }
.etiqueta { flex: none; font: 600 10.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; border-radius: 3px; padding: 3px 7px; white-space: nowrap; }
.etiqueta.rojo { background: var(--acento); color: #140405; }
.etiqueta.ambar { background: var(--ambar); color: #141414; }
:root[data-theme="light"] .etiqueta.rojo { color: #fff; }
:root[data-theme="light"] .etiqueta.ambar { color: #fff; }
.tabla tr.elegida td { background: var(--sup2); }
.tabla.coste-t tr.elegida td:first-child { box-shadow: inset 2px 0 0 var(--acento); }
.parte { display: flex; align-items: center; gap: 8px; min-width: 120px; }
.parte .barra { max-width: 70px; height: 6px; border-radius: 3px; }
.coste-t th { white-space: nowrap; }
.coste-t .sublinea { display: block; font-size: 11.5px; }
.parte .mono { font-size: 12px; color: var(--tinta2); }
.nota-verde { font-size: 11px; color: var(--verde); margin-left: 4px; }
.barra-leyenda { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 14px; font: 500 12px var(--mono); color: var(--tinta2); margin-bottom: 6px; }
.barra-leyenda i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.barra-leyenda i.cap, .barra-doble > div:first-child { background: var(--tinta3); }
.barra-leyenda i.int, .barra-doble > div:last-child { background: var(--ambar); }
.barra-doble { display: flex; height: 10px; border-radius: 5px; overflow: hidden; gap: 2px; }
.coste-bonif { border-top: 1px solid var(--borde); padding-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.bloque .calc-datos { margin: 4px 0; }
.bloque-cab .btn { flex: none; }

/* ── v8.10: ¿y si pido otro? ── */
.sim { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
.sim-form { flex: 1 1 300px; max-width: 380px; }
.sim-form h2 { margin-bottom: 2px; }
.sim-form .fila2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.sim-cuota { border-top: 1px solid var(--borde); padding-top: 12px; display: flex; flex-direction: column; gap: 4px; }
.sim-cuota .hero { font-size: 32px; }
.sim-res { flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.sim-res .kpi-v { font-size: 19px; }
.barra-doble + .ayuda { margin-top: 8px; }

/* ── v8.10.1: extracto de la tarjeta ── */
.ok-caja { background: color-mix(in srgb, var(--verde) 13%, transparent); color: var(--verde); }
.aviso-caja { padding: 9px 12px; border-radius: var(--r-peq); background: var(--ambar-suave); color: var(--ambar); font-size: 12.5px; font-weight: 600; line-height: 1.45; }
.form label.check { flex-direction: row; align-items: flex-start; gap: 8px; text-transform: none; letter-spacing: 0; font-size: 13px; font-weight: 500; color: var(--tinta); }
.form label.check input { margin-top: 2px; }
.form label.mal input { box-shadow: inset 0 0 0 2px var(--rojo); }
.extracto-bloque { display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--borde); border-radius: var(--r); padding: 12px 14px; background: var(--sup2); }
.extracto-cab { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.lector-extracto { display: flex; flex-direction: column; gap: 8px; border: 1px dashed var(--borde2, var(--borde)); border-radius: var(--r-peq); padding: 10px 12px; }
.lector-extracto.encima { border-color: var(--acento); background: var(--acento-suave); }
.lector-fila { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.lector-fila .tenue { font-size: 12px; }
.extracto-campos { display: flex; flex-direction: column; gap: 10px; }
.extracto-campos fieldset, .extracto-cambios { border: 1px solid var(--borde); border-radius: var(--r-peq); padding: 8px 12px 12px; margin: 0; min-width: 0; }
.extracto-campos legend, .extracto-cambios legend { padding: 0 6px; font: 600 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--tinta2); }
.extracto-campos .fila { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
.extracto-cambios { display: flex; flex-direction: column; gap: 6px; }
.tabla.mini-t { font-size: 12.5px; width: 100%; }
.tabla.mini-t th, .tabla.mini-t td { padding: 5px 8px; }
.extracto-resumen { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.desglose-barra { line-height: 1.5; }
.desglose-barra strong { font-size: 16px; margin-right: 4px; }
.barra-recibo { display: flex; gap: 2px; height: 10px; border-radius: 5px; overflow: hidden; }
.d-intereses { color: var(--acento-tinta); } .barra-recibo .d-intereses { background: var(--acento); }
.d-comisiones { color: var(--ambar); } .barra-recibo .d-comisiones { background: var(--ambar); }
.d-capital { color: var(--verde); } .barra-recibo .d-capital { background: var(--verde); }
.d-planes { color: var(--tinta2); } .barra-recibo .d-planes { background: var(--tinta3); }
.extracto-vista { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.extracto-vista h3 { font: 600 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--tinta2); margin-bottom: 6px; }
.extracto-vista dl > div { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; border-bottom: 1px solid var(--borde); font-size: 13px; }
.extracto-vista dt { color: var(--tinta2); }
.deuda-tarjeta { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; }
.deuda-tarjeta > div { display: flex; flex-direction: column; gap: 2px; background: var(--sup); border: 1px solid var(--borde); border-radius: var(--r-peq); padding: 8px 10px; }
.deuda-tarjeta .dt-t { font: 600 10.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--tinta2); }
.deuda-tarjeta strong { font-size: 17px; }
.deuda-tarjeta .tenue { font-size: 11.5px; }

/* ── v8.11: dónde se cobra, número completo y logotipos ── */
.campo-cobro { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; text-transform: none; letter-spacing: 0; font-size: 13.5px; font-weight: 500; color: var(--tinta); min-height: 34px; }
.campo-cobro .cc-forma { font-family: var(--mono); font-size: 12.5px; }
.campo-cobro .cc-falta { color: var(--acento-tinta); font-weight: 600; }
.cc-hist { width: 100%; font-size: 12.5px; color: var(--tinta2); }
.cc-hist summary { cursor: pointer; }
.cc-hist ul { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.cc-hist li { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pregunta-alcance { display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--ambar); background: var(--ambar-suave); border-radius: var(--r-peq); padding: 10px 12px; font-size: 13px; }
.pregunta-alcance .check { display: flex; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 8px; text-transform: none; letter-spacing: 0; font-size: 13px; font-weight: 500; color: var(--tinta); }
.pregunta-alcance input[type=date], .pregunta-alcance select { width: auto; padding: 4px 8px; }
.form label.ancho-num { grid-column: span 2; }
.opcional { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--tinta3); }
.grupo-form { border: 1px solid var(--borde); border-radius: var(--r-peq); padding: 8px 12px 12px; margin: 0; min-width: 0; }
.grupo-form legend { padding: 0 6px; font: 600 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--tinta2); }
.cuadro-t td.prevista { color: var(--tinta3); font-style: italic; cursor: pointer; padding-left: 10px; padding-right: 10px; white-space: nowrap; }
.cuadro-t td.prevista:hover { color: var(--tinta); }
.cuadro-t td.prevista.propia { color: var(--ambar); }
.cuadro-t td.dig { font-family: var(--mono); font-size: 12px; white-space: nowrap; }
.falta-forma { display: block; }
.alta-rapida .ancho-num { min-width: 180px; grid-column: auto; }
.alta-rapida > .btn { grid-column: -2 / -1; }
.ex-forma { font-size: 11px; }

.logo-ent { flex: none; display: inline-flex; align-items: center; justify-content: center; border-radius: 6px; overflow: hidden; vertical-align: middle; }
.logo-ent.img { background: #fff; box-shadow: inset 0 0 0 1px var(--borde); }
.logo-ent.img img { width: 100%; height: 100%; object-fit: contain; display: block; }
.logo-ent.ini { background: var(--sup3); color: var(--tinta); font-family: var(--mono); font-weight: 600; letter-spacing: -.02em; box-shadow: inset 0 0 0 1px var(--borde2); }
.logo-ent.ini.persona { border-radius: 50%; background: transparent; color: var(--tinta2); }
.con-logo { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.aviso-quien { display: inline-flex; align-items: center; gap: 6px; }
.p-cab .logo-ent, .ficha-titulo .logo-ent { border-radius: 9px; }
.logos-t td { vertical-align: middle; }
.logos-acc { display: flex; gap: 6px; align-items: center; }
.logos-acc label.btn { cursor: pointer; }
.filtros-periodo { align-items: center; }
.filtros-periodo select, .filtros-periodo input[type=month] { width: auto; padding: 7px 10px; }
.etq-filtro { font: 600 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--tinta2); }
.periodo-txt { margin-left: auto; font-size: 12.5px; }

/* ── v8.12: tarjetas ── */
.tarjetas-lista { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 14px; }
.tarjeta-ficha { display: flex; flex-direction: column; gap: 10px; background: var(--sup); border: 1px solid var(--borde); border-radius: var(--r); padding: 14px 16px; }
.tarjeta-ficha.terminada { opacity: .6; }
.tf-cab { display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; }
.tf-cab:hover strong { color: var(--acento-tinta); }
.tf-nombre { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.tf-nombre strong { font-size: 15.5px; }
.tf-nombre .tenue { font-size: 12.5px; }
.tf-deuda { display: flex; flex-direction: column; gap: 2px; }
.tf-deuda > div:first-child { display: flex; align-items: baseline; gap: 10px; }
.tf-deuda strong { font-size: 22px; }
.tf-deuda .tenue, .tf-uso .tenue { font-size: 12.5px; }
.tf-uso { display: flex; flex-direction: column; gap: 5px; }
.tf-prestamos { list-style: none; margin: 0; padding: 8px 0 0; border-top: 1px solid var(--borde); display: flex; flex-direction: column; gap: 5px; font-size: 13px; }
.tf-prestamos li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: baseline; }
.tf-prestamos li .tenue { grid-column: 1 / -1; font-size: 12px; }
.tf-prestamos .enlace { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tf-cargo { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; border-top: 1px solid var(--borde); padding-top: 10px; font-size: 13px; }
.tf-cargo .mono { font-size: 15px; }
.tf-cargo .btn { margin-left: auto; }
.tf-cargo.pendiente > span:first-child::before { content: '●'; color: var(--ambar); margin-right: 6px; }
.tf-cargo.vence > span:first-child::before { content: '●'; color: var(--acento); margin-right: 6px; }
.recibo-pendiente { display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--ambar); background: var(--ambar-suave); border-radius: var(--r); padding: 12px 14px; font-size: 13.5px; }
.recibo-pendiente.vencido { border-color: var(--acento); background: var(--acento-suave); }
.meter-prestamo { width: auto; max-width: 100%; }
@media (max-width: 860px) { .tarjetas-lista { grid-template-columns: 1fr; } }

/* v8.12.1: extractos de recibos anteriores */
.antiguos-t td { white-space: normal; vertical-align: top; }
.antiguos-t td:nth-child(3), .antiguos-t td:nth-child(4), .antiguos-t td:nth-child(5) { white-space: nowrap; }
.antiguos-t td:last-child { min-width: 170px; }
.antiguos-t .num .tenue { font-size: 11px; }
.antiguos-t .ambar { color: var(--ambar); font-size: 11px; white-space: normal; }

/* ── v9.1: menú del móvil (barra abajo + «Más») ── */
.barra-movil, .marca-movil, .titulo-movil { display: none; }
@media (max-width: 860px) {
  .lateral { display: none; }
  .cabecera { position: sticky; top: 0; z-index: 30; gap: 8px; padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top)); background: var(--bg); border-bottom: 1px solid var(--borde); }
  .marca-movil { display: inline-flex; color: var(--tinta); flex: none; }
  .titulo-movil { display: block; flex: 1; min-width: 0; font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn-buscar .txt, .btn-buscar kbd { display: none; }
  .btn-buscar { width: 36px; height: 36px; padding: 0; justify-content: center; }
  .barra-movil { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 80; background: var(--lateral); border-top: 1px solid var(--borde); padding-bottom: env(safe-area-inset-bottom); }
  .barra-movil button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 2px 6px; color: var(--tinta2); font-size: 10.5px; font-weight: 600; min-height: 56px; }
  .barra-movil button.activo { color: var(--tinta); }
  .barra-movil button.activo .bm-ico { color: var(--acento); }
  .barra-movil button.activo .bm-t { color: var(--tinta); }
  .bm-ico { position: relative; display: inline-flex; }
  .bm-badge { position: absolute; top: -5px; right: -10px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--acento); color: #fff; font: 700 10px/16px var(--mono); text-align: center; }
  .bm-t { white-space: nowrap; }
  main { padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
  .toast { bottom: calc(72px + env(safe-area-inset-bottom)); max-width: calc(100vw - 24px); }
  .hoja-fondo { position: fixed; inset: 0; z-index: 70; background: rgba(0, 0, 0, .45); display: flex; align-items: flex-end; }
  .hoja-mas { width: 100%; max-height: 82vh; overflow-y: auto; background: var(--sup); border-radius: 16px 16px 0 0; border-top: 1px solid var(--borde); padding: 8px 16px calc(76px + env(safe-area-inset-bottom)); }
  .hoja-asa { width: 40px; height: 4px; border-radius: 2px; background: var(--borde2); margin: 2px auto 10px; }
  .hoja-grupo { margin-bottom: 12px; }
  .hoja-g { font: 600 10.5px var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--tinta3); margin: 0 0 6px 2px; }
  .hoja-items { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .hoja-items button { text-align: left; padding: 11px 12px; border-radius: 10px; background: var(--sup2); border: 1px solid var(--borde); font-weight: 600; font-size: 13.5px; color: var(--tinta); display: flex; justify-content: space-between; align-items: center; }
  .hoja-items button.activo { border-color: var(--acento); }
  .hoja-pie { color: var(--tinta3); font-size: 11.5px; margin: 4px 2px 0; }
}

/* ── v9.2: firma ── */
.panel-firma { display: flex; flex-direction: column; gap: 6px; }
.panel-firma canvas { width: 100%; background: #fff; color: #1a2a6c; border: 1.5px dashed var(--borde2); border-radius: 10px; touch-action: none; cursor: crosshair; }
.pf-pie { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.firma-guardada { background: #fff; border-radius: 8px; padding: 6px 10px; display: inline-flex; border: 1px solid var(--borde); }
.clave-grande { font: 700 34px var(--mono); letter-spacing: .25em; color: var(--tinta); background: var(--sup2); border: 1px solid var(--borde); border-radius: 10px; padding: 8px 16px; display: inline-block; }
.enlace-firma { font: 11px var(--mono); color: var(--tinta2); word-break: break-all; max-height: 4.5em; overflow: hidden; background: var(--sup2); border-radius: 8px; padding: 8px 10px; }
.firmas-t td { white-space: normal; }
/* v9.2 · páginas Firmar y Comprobar */
.firmar-pag { max-width: 820px; margin: 0 auto; padding: 16px 16px 60px; display: flex; flex-direction: column; gap: 14px; }
.firmar-cab { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--borde); }
.firmar-cab span { font: 600 12px var(--mono); color: var(--tinta2); text-transform: uppercase; letter-spacing: .6px; }
.firmar-pag > h2 { margin: 4px 0 0; font-size: 20px; }
.firmar-papel { max-height: none; }
.firmar-form { background: var(--sup); border: 1px solid var(--borde); border-radius: var(--r); padding: 14px; }
.casilla.grande { font-size: 15px; font-weight: 600; }
.clave-entrada { max-width: 260px; }
.botones.col { flex-direction: column; align-items: stretch; }
.botones.col .btn { justify-content: center; }
.comprobar-t th { text-align: left; width: 34%; color: var(--tinta2); font-weight: 600; vertical-align: top; }
.comprobar-t td { word-break: break-word; }
.fila-pegar { display: flex; gap: 8px; }
.fila-pegar input { flex: 1; min-width: 0; }
.pie-firmar { margin-top: 20px; }
a.btn { text-decoration: none; color: var(--tinta); }
a.btn.primario { color: #140405; }
/* v9.2.1 · opciones del contrato y del reconocimiento ordenadas: los campos arriba y las casillas en su fila */
.doc-opciones .fila.op-contrato { grid-template-columns: minmax(150px, .8fr) minmax(210px, 1fr) minmax(260px, 1.6fr); }
.doc-opciones .selector-cobros { display: flex; min-width: 0; width: 100%; }
.doc-opciones .sc-boton { width: 100%; min-height: 40px; line-height: 1.35; }
.doc-opciones .fila-botones { margin-top: 2px; }
@media (max-width: 860px) { .doc-opciones .fila.op-contrato { grid-template-columns: 1fr; } }
.doc-opciones .fila { align-items: start; }
.doc-opciones .fila:not(.op-contrato) .selector-cobros { grid-column: span 2; }
@media (max-width: 860px) { .doc-opciones .fila:not(.op-contrato) .selector-cobros { grid-column: auto; } }
/* v9.3 · tu Google para la firma */
.nube-firma { display: flex; flex-direction: column; gap: 8px; padding: 12px; border: 1px solid var(--borde); border-radius: var(--r-peq); background: var(--sup2); }
.nube-firma h4 { margin: 0; }
.pasos-nube { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.codigo-script { max-height: 280px; overflow: auto; font: 11px/1.45 var(--mono); background: var(--fondo, #0b0c0f); border: 1px solid var(--borde); border-radius: var(--r-peq); padding: 10px; white-space: pre; user-select: all; }
/* v9.3.1 · Ajustes → tus datos: los campos alineados aunque una etiqueta ocupe dos líneas, y un email largo no se sale de su caja */
.cond-grid { align-items: end; }
.cond-grid .campo-ed { min-width: 0; }
.cond-grid .campo-ed .ed-ver { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cond-grid label.doble { grid-column: span 2; }
@media (max-width: 420px) { .cond-grid label.doble { grid-column: auto; } }
/* v9.3.4 · Documentos en firma */
.firmas-lista { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
.firma-tarjeta { background: var(--sup); border: 1px solid var(--borde); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.firma-tarjeta.e-anulada, .firma-tarjeta.e-caducada { opacity: .72; }
.ft-cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.ft-cab h3 { margin: 0 0 3px; font-size: 15px; }
.ft-pasos { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.ft-pasos li { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 8px; align-items: center; padding: 8px 10px; border: 1px solid var(--borde); border-radius: var(--r-peq); background: var(--sup2); color: var(--tinta2); }
.ft-pasos li.hecho { border-color: color-mix(in srgb, var(--verde) 45%, var(--borde)); color: var(--tinta); }
.ft-punto { grid-row: span 2; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font: 700 12px var(--mono); background: var(--sup3); }
.ft-pasos li.hecho .ft-punto { background: color-mix(in srgb, var(--verde) 22%, transparent); color: var(--verde); }
.ft-t { font-size: 13px; font-weight: 700; }
.ft-cuando { font: 11.5px var(--mono); color: var(--tinta2); }
.ft-pie { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.firmas-pegar { margin-top: 22px; padding: 14px 16px; border: 1px dashed var(--borde2); border-radius: var(--r); display: flex; flex-direction: column; gap: 8px; }
.firmas-pegar h4 { margin: 0; }
@media (max-width: 860px) { .ft-pasos { grid-template-columns: 1fr 1fr; } .ft-cab { flex-direction: column; } }
/* v9.4 · copia por email */
.ft-copia { font-size: 12.5px; padding: 6px 10px; border-radius: var(--r-peq); background: var(--sup2); color: var(--tinta2); }
.ft-copia.ok { color: var(--verde); background: color-mix(in srgb, var(--verde) 10%, transparent); }
.ft-copia.mal { color: var(--rojo); background: var(--rojo-suave); }
.clave-sep { margin-left: .45em; }
/* Datos de pago: cada campo en su línea */
.fila.campos-pago { display: flex; flex-direction: column; align-items: stretch; }
.fila.campos-pago > label { width: 100%; }
.ex-pago, .ayuda strong { white-space: pre-line; }
/* v9.8 · fases del contrato */
.panel-contrato { background: var(--sup); border: 1px solid var(--borde); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.pc-cab { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.panel-contrato p { margin: 0; }
.solvencia .cond-grid { margin-top: 8px; }
/* v9.6 · Ajustes por apartados: en el PC, menú a la izquierda; en el móvil, primero la lista y luego el apartado */
.aj-cuerpo { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 20px; align-items: start; }
.aj-menu { position: sticky; top: 68px; display: flex; flex-direction: column; gap: 2px; padding: 6px; background: var(--sup); border: 1px solid var(--borde); border-radius: var(--r); }
.aj-menu button { display: flex; flex-direction: column; gap: 2px; padding: 9px 10px; text-align: left; border-left: 3px solid transparent; border-radius: var(--r-peq); }
.aj-menu button:hover { background: var(--sup2); }
.aj-menu button.activo { background: var(--sup2); border-left-color: var(--acento); }
.aj-t { font-size: 13.5px; font-weight: 600; color: var(--tinta); }
.aj-s { font-size: 11.5px; line-height: 1.3; color: var(--tinta2); }
.aj-contenido { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.aj-contenido > h2 { margin: 0; font-size: 18px; }
.aj-volver { display: none; align-self: flex-start; }
@media (max-width: 860px) {
  .aj-cuerpo { grid-template-columns: minmax(0, 1fr); }
  .aj-menu { position: static; }
  .aj-menu button { position: relative; min-height: 56px; justify-content: center; padding: 10px 28px 10px 12px; }
  .aj-menu button.activo { background: none; border-left-color: transparent; }
  .aj-menu button::after { content: '›'; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 20px; color: var(--tinta3); }
  .ajustes:not(.aj-dentro) .aj-contenido { display: none; }
  .ajustes.aj-dentro .aj-menu { display: none; }
  .ajustes.aj-dentro .pag-cab { display: none; }
  .aj-volver { display: inline-flex; }
}
</style>
</head>

.extracto-papel { background: #fff; color: #141414; font-family: 'IBM Plex Sans', 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12.5px; line-height: 1.45; padding: 28px 30px; max-width: 820px; margin: 0 auto; }
.extracto-papel * { box-sizing: border-box; }
.ex-cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; border-bottom: 2px solid #1a1714; padding-bottom: 10px; }
.ex-titulo { font-size: 22px; font-weight: 800; letter-spacing: -.3px; }
.ex-sub { color: #6b665e; margin-top: 2px; }
.ex-fecha { text-align: right; color: #6b665e; font-size: 12px; }
.ex-partes { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin: 16px 0; }
.ex-partes > div { display: flex; flex-direction: column; gap: 1px; }
.ex-et { font-size: 10px; text-transform: uppercase; letter-spacing: .6px; color: #8a8478; font-weight: 700; margin-bottom: 2px; }
.ex-resumen { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0; border: 1px solid #d8d3cb; border-radius: 6px; overflow: hidden; margin-bottom: 12px; }
.ex-resumen > div { padding: 9px 12px; display: flex; flex-direction: column; border-right: 1px solid #d8d3cb; }
.ex-resumen > div:last-child { border-right: none; }
.ex-resumen span { font-size: 11px; color: #6b665e; }
.ex-resumen strong { font-size: 16px; font-variant-numeric: tabular-nums; }
.ex-resumen .ex-total { background: #f2efe9; }
.ex-acuerdo { padding: 8px 12px; border-left: 3px solid #4a7000; background: #f6f8ef; margin-bottom: 8px; font-size: 12px; }
.ex-acuerdo.atraso { border-left-color: #b86e00; background: #fbf5ea; }
.ex-tabla { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; }
.ex-tabla th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .5px; color: #6b665e; border-bottom: 1.5px solid #1a1714; padding: 6px 6px; }
.ex-tabla td { padding: 5px 6px; border-bottom: 1px solid #e6e2db; vertical-align: top; }
.ex-tabla .n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ex-tabla tfoot td { border-top: 1.5px solid #1a1714; border-bottom: none; font-weight: 700; }
.ex-tabla .ex-ant td { color: #6b665e; font-style: italic; }
.ex-tabla .aj td { color: #6b665e; font-style: italic; }
.ex-pago { margin-top: 14px; padding: 10px 12px; border: 1px dashed #b9b3a9; border-radius: 6px; white-space: pre-wrap; }
.ex-pie { margin-top: 18px; color: #8a8478; font-size: 10.5px; text-align: center; }
@media print { .extracto-papel { padding: 0; max-width: none; } @page { margin: 14mm; } }
